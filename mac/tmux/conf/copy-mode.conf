# ╭─────────────────────────────────────────────────────╮
# │                  Copy Mode (Vi Style)               │
# ╰─────────────────────────────────────────────────────╯

# ------------------------------------------------------
# Enable Vim-style keybindings in copy mode
# ------------------------------------------------------
#
# Navigation:
#
#   h j k l
#   gg
#   G
#   /
#   ?
#   n
#   N
#
set-window-option -g mode-keys vi

# Enter copy mode.
#
# Shortcut:
#
#     Prefix + v
#
bind v copy-mode


# ------------------------------------------------------
# Copy Mode Keybindings
# ------------------------------------------------------

# Start selecting text.
#
# Same as Vim's:
#
#     v
#
bind-key -T copy-mode-vi v send-keys -X begin-selection


# Toggle rectangular (block) selection.
#
# Same as Vim's:
#
#     Ctrl+v
#
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle


# Copy the selected text.
#
# Unlike Enter,
# this keeps you inside copy mode,
# matching Vim's yank behavior.
#
bind-key -T copy-mode-vi y send-keys -X copy-selection


# Mouse selection.
#
# When releasing the mouse:
#
# • Copy the selection
# • Stay in copy mode
#
# Prevents the viewport from jumping back
# to the live terminal output.
#
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection


# Copy selection and exit copy mode.
#
# Shortcut:
#
#     Enter
#
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel


# Copy the entire current line.
#
# Equivalent to:
#
#     yy
#
# or
#
#     Y
#
# in Vim.
#
bind-key -T copy-mode-vi Y send-keys -X copy-line


# ------------------------------------------------------
# Jump Between Shell Prompts
# ------------------------------------------------------
#
# Store the Starship prompt character
# as a tmux variable.
#
# Prompt glyph:
#
#     U+F432
#
run-shell "tmux set -g @prompt_char $(printf '\\xef\\x90\\xb2')"


# Jump to the previous shell prompt.
#
# Shortcut:
#
#     [
#
bind-key -T copy-mode-vi [ \
  run-shell 'tmux send-keys -X search-backward "$(tmux show -gvq @prompt_char)"'


# Jump to the next shell prompt.
#
# Shortcut:
#
#     ]
#
bind-key -T copy-mode-vi ] \
  run-shell 'tmux send-keys -X search-forward "$(tmux show -gvq @prompt_char)"'


# ------------------------------------------------------
# Mouse Wheel Speed
# ------------------------------------------------------
#
# Reduce scrolling speed.
#
# Default:
#
#     5 lines
#
# This configuration:
#
#     2 lines
#
# for smoother scrolling.
#
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down


# ------------------------------------------------------
# Keyboard Scrolling
# ------------------------------------------------------
#
# Ctrl+e
#
# Scroll down.
#
bind-key -T copy-mode-vi C-e send-keys -X -N 5 scroll-down


# Ctrl+y
#
# Scroll up.
#
bind-key -T copy-mode-vi C-y send-keys -X -N 5 scroll-up


# ------------------------------------------------------
# Mouse Wheel Behavior (Normal Mode)
# ------------------------------------------------------
#
# Mouse wheel follows this priority:
#
# 1.
# If already in copy mode
# OR the current application has mouse support
# (e.g. Neovim with mouse=a)
#
#     → Forward the mouse event.
#
#
# 2.
# If running in the alternate screen
# (less, vim, etc.) WITHOUT mouse support
#
#     → Simulate Up / Down keys.
#
#
# 3.
# Otherwise
#
#     → Enter copy mode automatically
#       and scroll the terminal history.
#

bind -T root WheelUpPane \
  if-shell -Ft= "#{?pane_in_mode,1,#{mouse_any_flag}}" \
    "send-keys -Mt=" \
    "if-shell -Ft= '#{alternate_on}' \
      'send-keys -t= -N 2 Up' \
      'copy-mode -e; send-keys -t= -X -N 2 scroll-up'"

bind -T root WheelDownPane \
  if-shell -Ft= "#{?pane_in_mode,1,#{mouse_any_flag}}" \
    "send-keys -Mt=" \
    "if-shell -Ft= '#{alternate_on}' \
      'send-keys -t= -N 2 Down' \
      'send-keys -Mt='"
