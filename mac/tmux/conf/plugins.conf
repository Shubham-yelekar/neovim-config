# ╭─────────────────────────────────────────────────────╮
# │                     Plugins                         │
# ╰─────────────────────────────────────────────────────╯
#
# First-time setup on a new machine:
#
# 1. Clone TPM (Tmux Plugin Manager):
#
#    git clone --depth=1 --single-branch --no-tags \
#    https://github.com/tmux-plugins/tpm \
#    ~/.config/tmux/plugins/tpm
#
# 2. Start tmux and load the configuration:
#
#    tmux source ~/.config/tmux/tmux.conf
#
# 3. Install all configured plugins:
#
#    Option A:
#        Press Prefix + I (capital I) inside tmux.
#
#    Option B:
#        Run:
#
#        ~/.config/tmux/plugins/tpm/bin/install_plugins
#
#
# Plugins are installed into:
#
#     ~/.config/tmux/plugins/
#
# (Controlled by TMUX_PLUGIN_MANAGER_PATH)
#
# Update plugins:
#
#     Prefix + U
#
# Remove plugins that are no longer listed:
#
#     Prefix + Alt + U



# ------------------------------------------------------
# Plugin Manager
# ------------------------------------------------------

# Official Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'


# A collection of sensible default tmux settings.
#
# Improves many default behaviors without requiring
# manual configuration.
set -g @plugin 'tmux-plugins/tmux-sensible'


# Catppuccin theme for tmux.
#
# Modern UI matching Neovim, Ghostty, etc.
set -g @plugin 'catppuccin/tmux'


# Save and restore the complete tmux workspace:
#
# • Sessions
# • Windows
# • Panes
# • Layouts
# • Working directories
# • Running programs
#
set -g @plugin 'tmux-plugins/tmux-resurrect'


# Extends tmux-resurrect by providing:
#
# • Automatic periodic saves
# • Automatic restore on tmux startup
#
set -g @plugin 'tmux-plugins/tmux-continuum'


# Optional:
#
# Project/session manager.
#
# Quickly create and load predefined tmux layouts.
#
# set -g @plugin 'jimeh/tmuxifier'



# ------------------------------------------------------
# Catppuccin
# ------------------------------------------------------

# Theme flavor
set -g @catppuccin_flavor 'mocha'



# ------------------------------------------------------
# tmux-resurrect
# ------------------------------------------------------

# Save:
#
#     Prefix + Ctrl+s
#
# Restore:
#
#     Prefix + Ctrl+r


# Save pane output along with the layout.
#
# This restores scrollback history as well.
set -g @resurrect-capture-pane-contents 'on'


# Restore Neovim using session files
# instead of reopening an empty editor.
set -g @resurrect-strategy-nvim 'session'


# Restore AI CLI tools by replacing the
# original launch command with their
# respective "continue" commands.
#
# Format:
#
#     process_name -> restore_command
#
set -g @resurrect-processes \
'"~claude->claude --continue" \
 "~codex->codex resume --last" \
 "~opencode->opencode --continue"'



# ------------------------------------------------------
# tmux-continuum
# ------------------------------------------------------

# Automatically restore the most recent
# saved tmux environment when tmux starts.
#
# Must be enabled BEFORE TPM is loaded.
set -g @continuum-restore 'on'


# Automatically save every 15 minutes.
set -g @continuum-save-interval '15'



# ------------------------------------------------------
# TPM
# ------------------------------------------------------

# TPM must always be loaded LAST.
run '~/.config/tmux/plugins/tpm/tpm'
