# ╭─────────────────────────────────────────────────────╮
# │             Popup Floating Terminal                 │
# ╰─────────────────────────────────────────────────────╯
#
# Ctrl + `
#
# Opens a persistent floating "scratch" terminal in the
# current pane's working directory.
#
# Press the shortcut again to hide it.
#
#
# ------------------------------------------------------
# How the shortcut reaches tmux
# ------------------------------------------------------
#
# The terminal emulator sends a CSI-u encoded key sequence.
#
# Ghostty:
#   keybind = ctrl+grave_accent=text:\x1b[96;5u
#
# Kitty:
#   map ctrl+grave send_text all \x1b[96;5u
#
# WezTerm:
#   SendString('\x1b[96;5u')
#
# Combined with the settings in options.conf:
#
#     extended-keys always
#     terminal-features extkeys
#
# tmux can correctly recognize the sequence as:
#
#     Ctrl + `
#
# instead of interpreting it as a normal backtick (`).
#
#
# ------------------------------------------------------
# Why opening and closing are handled separately
# ------------------------------------------------------
#
# When the popup is open,
# keyboard focus belongs to the popup client.
#
# Neovim never receives:
#
#     <leader>tt
#
# Therefore,
# hiding the popup must be handled by tmux itself.
#
# The popup is detected by checking the current session name.
#
# Any session beginning with:
#
#     popup-*
#
# is considered a scratch popup created by:
#
#     popup-term.sh
#
#
# ------------------------------------------------------
# Why detach instead of killing the popup?
# ------------------------------------------------------
#
# We detach the popup client:
#
#     detach-client
#
# instead of:
#
#     kill-session
#
# because we want every process running inside
# the popup terminal to continue running.
#
# This persistent behavior is the entire advantage of
# using a popup terminal instead of opening a brand new shell
# every time.
#
#
# ------------------------------------------------------
# Fallback
# ------------------------------------------------------
#
# If tmux fails to recognize:
#
#     \033[96;5u
#
# as Ctrl+`,
# (for example, because the terminal failed to negotiate
# extended key support),
#
# you can bypass tmux's key parser completely
# by matching the raw escape sequence directly:
#
#     set -s user-keys[0] '\033[96;5u'
#
#     bind-key -n User0 ...
#
# Simply replace:
#
#     C-`
#
# with:
#
#     User0
#
# in the binding below.
#
bind-key -n 'C-`' if-shell -F '#{m:popup-*,#{session_name}}' \
  'detach-client' \
  'run-shell -b "~/.config/tmux/scripts/popup-term.sh #{q:#{?@nvim_cwd,#{@nvim_cwd},#{pane_current_path}}} #{q:@nvim_popup_id}"'
