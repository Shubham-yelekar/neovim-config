# ╭─────────────────────────────────────────────────────╮
# │      Pane Management                                │
# │  Matches the terminal's Ctrl+Alt+* shortcuts        │
# │  (No prefix required)                               │
# ╰─────────────────────────────────────────────────────╯

# ------------------------------------------------------
# Right-click Paste
# ------------------------------------------------------
#
# If the application currently owns the mouse
# (Neovim, Yazi, etc.):
#
#     → Forward the mouse event.
#
# Otherwise:
#
#     → Paste the system clipboard.
#
bind-key -T root MouseDown3Pane \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send-keys -M" \
    'run-shell "~/.config/tmux/scripts/clipboard_paste.sh | tmux load-buffer - && tmux paste-buffer -p"'


# ------------------------------------------------------
# Pane Creation / Closing
# ------------------------------------------------------

# Split vertically (left / right).
#
# Open the new pane in the same working directory.
bind-key -n C-M-\\ split-window -h -c "#{pane_current_path}"

# Split horizontally (top / bottom).
#
# Open the new pane in the same working directory.
bind-key -n C-M-- split-window -v -c "#{pane_current_path}"

# Close the current pane.
bind-key -n C-M-w kill-pane


# ------------------------------------------------------
# Pane Navigation / Resizing
# ------------------------------------------------------
#
# All logic deciding whether a key should go to
# Neovim or tmux lives in:
#
#     scripts/pane-nav.sh
#
# That script contains the complete explanation.
#
# Philosophy:
#
#     Detect which program currently owns the terminal.
#
# Instead of relying on smart-splits'
#
#     @pane-is-vim
#
# variable.
#
# Why?
#
# If Neovim crashes or is killed,
# @pane-is-vim may remain true forever,
# causing pane navigation to stop working.
#
# This configuration instead checks the
# actual foreground process.
#
# Handles:
#
# • Neovim
# • env / sudo wrappers
# • Wrapper scripts that don't exec
# • Git commit editor
# • Editor launched from Yazi
# • SSH / Mosh sessions
#
# Ignores:
#
# • Suspended Neovim
# • Background Neovim
# • Headless Neovim
#
%hidden PANE_NAV="~/.config/tmux/scripts/pane-nav.sh"


# Move focus.
#
# The helper script decides whether the key
# should be handled by Neovim or tmux.
bind-key -n C-M-h run-shell -b "$PANE_NAV move h '#{pane_id}'"
bind-key -n C-M-j run-shell -b "$PANE_NAV move j '#{pane_id}'"
bind-key -n C-M-k run-shell -b "$PANE_NAV move k '#{pane_id}'"
bind-key -n C-M-l run-shell -b "$PANE_NAV move l '#{pane_id}'"


# Resize panes.
#
# Uses the same helper script.
bind-key -n C-M-Left  run-shell -b "$PANE_NAV resize h '#{pane_id}'"
bind-key -n C-M-Down  run-shell -b "$PANE_NAV resize j '#{pane_id}'"
bind-key -n C-M-Up    run-shell -b "$PANE_NAV resize k '#{pane_id}'"
bind-key -n C-M-Right run-shell -b "$PANE_NAV resize l '#{pane_id}'"


# ------------------------------------------------------
# Pane Zoom
# ------------------------------------------------------
#
# Toggle fullscreen for the current pane.
#
# Uses tmux's native per-window zoom.
#
# No hidden windows are created.
bind-key -n C-M-b resize-pane -Z


# ------------------------------------------------------
# Copy Mode Navigation
# ------------------------------------------------------
#
# Continue using Ctrl+Alt+H/J/K/L even while
# inside copy-mode.
#
# Prevents getting "stuck" in copy mode.
bind-key -T copy-mode-vi C-M-h if -F "#{pane_at_left}"   "" "select-pane -L"
bind-key -T copy-mode-vi C-M-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -T copy-mode-vi C-M-k if -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -T copy-mode-vi C-M-l if -F "#{pane_at_right}"  "" "select-pane -R"


# ------------------------------------------------------
# Ctrl + Click URLs
# ------------------------------------------------------
#
# If an OSC-8 hyperlink exists,
# open the real hyperlink target.
#
# Otherwise,
# fall back to the word under the mouse cursor.
#
# #{q:...} safely escapes the shell argument,
# preventing accidental expansion when passed
# through nested run-shell commands.
bind -n C-MouseDown1Pane \
  if-shell -F "#{||:#{m:*://*,#{mouse_hyperlink}},#{m:*://*,#{mouse_word}}}" \
    'run-shell -b "~/.config/tmux/scripts/open-url.sh #{?#{m:*://*,#{mouse_hyperlink}},#{q:mouse_hyperlink},#{q:mouse_word}}"'
