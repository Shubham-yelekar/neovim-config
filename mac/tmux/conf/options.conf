# ╭─────────────────────────────────────────────────────╮
# │                  Core Options                       │
# ╰─────────────────────────────────────────────────────╯

# Tell applications inside tmux to use the tmux-256color terminal
set -g default-terminal "tmux-256color"

# Enable extended keyboard support (CSI-u).
# Allows tmux to distinguish keys like:
#   Ctrl+Shift+T
#   Ctrl+1
#   Ctrl+Tab
# instead of treating them as normal characters.
set -s extended-keys always

# ------------------------------------------------------
# Terminal feature detection
# ------------------------------------------------------
#
# '-a' means "append".
#
# If this file is reloaded repeatedly, tmux would keep
# appending the same terminal features over and over.
#
# To avoid duplicate entries, use a sentinel variable
# (@terminal_features_applied) and only append once.
#
# We do NOT reset terminal-features before appending,
# because that would remove tmux's built-in capabilities
# (clipboard, focus events, title updates, etc.).
#
%if "#{==:#{@terminal_features_applied},}"

  # Enable True Color (24-bit color)
  set -as terminal-features '*:RGB'

  # Enable extended keyboard sequences (CSI-u)
  set -as terminal-features '*:extkeys'

  # Mark features as already added
  set -g @terminal_features_applied 1

%endif

# ------------------------------------------------------
# Prefix Key
# ------------------------------------------------------

# Remove the default prefix (Ctrl+B)
unbind C-b

# Set the prefix to Ctrl+Space
set -g prefix C-Space

# Pressing Ctrl+Space twice sends Ctrl+Space
# to the application running inside tmux.
bind C-Space send-prefix

# ------------------------------------------------------
# Numbering
# ------------------------------------------------------

# Start window numbering at 1 instead of 0.
# Matches Ctrl+1 ... Ctrl+8.
set -g base-index 1

# Start pane numbering at 1.
set -g pane-base-index 1

# Automatically renumber windows after one closes.
set -g renumber-windows on

# ------------------------------------------------------
# Session Behavior
# ------------------------------------------------------

# If the last window in a session is closed,
# switch to another session instead of shutting
# down the tmux server.
#
# Prevents accidentally exiting tmux,
# especially when popup/scratch sessions exist.
set -g detach-on-destroy off

# ------------------------------------------------------
# Scrollback History
# ------------------------------------------------------

# Default history is only about 2000 lines.
#
# Increase it so long outputs
# (AI tools, builds, logs, etc.)
# remain scrollable.
set -g history-limit 1000000

# ------------------------------------------------------
# Mouse Support
# ------------------------------------------------------

# Enable mouse support.
set -g mouse on

# Double-click selects words.
#
# Treat only spaces as separators.
#
# URLs like:
#
#   https://github.com/user/repo
#
# stay intact instead of splitting on:
#
#   -
#   /
#   .
set -g word-separators ' '

# ------------------------------------------------------
# Responsiveness
# ------------------------------------------------------

# Remove delay after pressing Escape.
set -sg escape-time 0

# Remove delay for repeated key bindings.
set -sg repeat-time 0

# ------------------------------------------------------
# Clipboard
# ------------------------------------------------------

# Allow applications (like Neovim)
# to write directly to the system clipboard
# using OSC52.
#
# Works locally and over SSH.
set -s set-clipboard on

# Allow terminal escape sequences
# to pass through tmux when needed.
#
# Required by modern terminal applications.
set -g allow-passthrough on

set -g display-time 750
set -g display-panes-time 750

# Don't display successful background command messages
set -g message-command-style "fg=default,bg=default"
