# ╭─────────────────────────────────────────────────────╮
# │     Auto-hide Status Bar (Plan C · tmux Side)       │
# ╰─────────────────────────────────────────────────────╯
#
# Automatically hide the tmux status bar whenever the
# current pane is running a command that matches the
# regular expression stored in @hide-bar-cmds.
#
# tmux hooks can only react to:
#
#   • Changing panes
#   • Changing windows
#   • Changing sessions
#
# They CANNOT detect when an application is started or
# exited inside the same pane.
#
# Example:
#
#     zsh
#       ↓
#     nvim
#       ↓
#     exit nvim
#
# Since tmux sees the same pane the entire time,
# no hook is triggered.
#
# To solve this,
# Neovim uses VimEnter and VimLeave autocommands
# to explicitly notify tmux whenever Neovim starts
# or exits.
#
# (See the Neovim configuration.)
#
# To extend this behavior to other full-screen
# applications such as:
#
#     man
#     less
#     btop
#
# simply update the regular expression below.
#

# Commands that should hide the status bar.
#
# Currently:
#
#     nvim
#     vim
#
set -g @hide-bar-cmds '^(nvim|vim)$'


# ------------------------------------------------------
# Pane Change
# ------------------------------------------------------
#
# Whenever the active pane changes,
# check the command running in that pane.
#
# If it matches @hide-bar-cmds:
#
#     Hide the status bar.
#
# Otherwise:
#
#     Show the status bar.
#
set-hook -g after-select-pane \
"if -F '#{m/r:#{@hide-bar-cmds},#{pane_current_command}}' \
'set status off' \
'set status on'"


# ------------------------------------------------------
# Window Change
# ------------------------------------------------------
#
# Perform the same check whenever the active
# window changes.
#
set-hook -g after-select-window \
"if -F '#{m/r:#{@hide-bar-cmds},#{pane_current_command}}' \
'set status off' \
'set status on'"


# ------------------------------------------------------
# Session Change
# ------------------------------------------------------
#
# Perform the same check whenever the client
# switches to another session.
#
set-hook -g client-session-changed \
"if -F '#{m/r:#{@hide-bar-cmds},#{pane_current_command}}' \
'set status off' \
'set status on'"
