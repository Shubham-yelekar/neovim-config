# ╭─────────────────────────────────────────────────────╮
# │                    Status Bar                       │
# ╰─────────────────────────────────────────────────────╯

# ------------------------------------------------------
# Status Bar Position
# ------------------------------------------------------

# Display the status bar at the top of the terminal.
set -g status-position top


# ------------------------------------------------------
# Base Colors
# ------------------------------------------------------

# Status bar colors.
#
# Based on the Catppuccin Mocha theme.
set -g status-bg '#1e1e2e'
set -g status-fg '#cdd6f4'

# Accent color used throughout the status bar.
set -g @accent '#cba6f7'


# ------------------------------------------------------
# Left Status Section
# ------------------------------------------------------
#
# Displays:
#
# • tmux icon
# • Session name
# • Current working directory
#
# The displayed path is smart-truncated:
#
# • Replace $HOME with "~"
# • Keep only the last three folders
# • Maximum width: 20 characters
#
set -g status-left '#[fg=#{@accent}]  #S#[fg=black] ⟩ #(echo "#{pane_current_path}" \
  | sed "s|^$HOME|~|" \
  | awk -F/ '\''{
      n = NF
      if (n > 3)
        path = $(n-2)"/"$(n-1)"/"$n
      else
        path = $0

      max = 20

      if (length(path) > max)
        print ".." substr(path, length(path)-max+4)
      else
        print path
  }'\'') '

# Unlimited length.
set -g status-left-length 0


# ------------------------------------------------------
# Window (Tab) Appearance
# ------------------------------------------------------

# Appearance of inactive windows.
set -g window-status-style 'fg=#585b70'

# Appearance of the active window.
set -g window-status-current-style 'fg=#cba6f7,bold'


# ------------------------------------------------------
# Window Labels
# ------------------------------------------------------
#
# Window title includes:
#
# • Window index
# • Window name
# • Zoom indicator
#
# Platform-specific behavior:
#
# Windows / WSL:
#
#     Use standard numbers for clarity.
#
# macOS:
#
#     Use Nerd Font icons for a cleaner look.
#
if-shell 'uname -a | grep -qi microsoft' \
    "set -g window-status-format ' #I #W#{?window_zoomed_flag, 󰁌 , }' ; \
     set -g window-status-current-format ' #I #W#{?window_zoomed_flag, 󰁌 , }'" \
    "set -g window-status-format '#{?#{==:#{window_index},1},󰬺 ,#{?#{==:#{window_index},2},󰬻 ,#{?#{==:#{window_index},3},󰬼 ,#{?#{==:#{window_index},4},󰬽 ,#{?#{==:#{window_index},5},󰬾 ,#{?#{==:#{window_index},6},󰬿 ,#{?#{==:#{window_index},7},󰭀 ,#{?#{==:#{window_index},8},󰭁 ,#{?#{==:#{window_index},9},󰭂 ,󰿩 }}}}}}}}}#W#{?window_zoomed_flag, 󰁌 , }' ; \
     set -g window-status-current-format '#{?#{==:#{window_index},1},󰬺 ,#{?#{==:#{window_index},2},󰬻 ,#{?#{==:#{window_index},3},󰬼 ,#{?#{==:#{window_index},4},󰬽 ,#{?#{==:#{window_index},5},󰬾 ,#{?#{==:#{window_index},6},󰬿 ,#{?#{==:#{window_index},7},󰭀 ,#{?#{==:#{window_index},8},󰭁 ,#{?#{==:#{window_index},9},󰭂 ,󰿩 }}}}}}}}}#W#{?window_zoomed_flag, 󰁌 , }'"


# ------------------------------------------------------
# Status Colors
# ------------------------------------------------------
#
# All colors and thresholds used by the status
# collector are declared here.
#
# The collector script only reads these values.
#

# CPU colors.
set -g @status_cpu_low '#a6e3a1'
set -g @status_cpu_medium '#f9e2af'
set -g @status_cpu_high '#f38ba8'

# RAM colors.
set -g @status_ram_low '#a6e3a1'
set -g @status_ram_medium '#f9e2af'
set -g @status_ram_high '#f38ba8'


# ------------------------------------------------------
# Network Colors
# ------------------------------------------------------
#
# Previously these values were scattered across
# net_speed.sh.
#
# They are now centralized here.
#

# Base background color.
set -g @status_net_base '#1e1e2e'

# Default text color.
set -g @status_net_text '#cdd6f4'

# Surface color.
set -g @status_net_surface '#313244'

# Download speed color.
set -g @status_net_down '#a6e3a1'

# Upload speed color.
set -g @status_net_up '#fab387'

# Hide network speed when traffic is
# below 30 KB/s.
set -g @status_net_threshold '30720'


# ------------------------------------------------------
# Dynamic Theme (Disabled)
# ------------------------------------------------------

# Previous Matugen-generated colors.
#
# Kept only as a fallback.
#
# source-file -q ~/.config/tmux/conf/matugen-colors.conf


# ------------------------------------------------------
# Right Status Section
# ------------------------------------------------------
#
# Values are pushed by the background collector.
#
# Rendering the status bar itself launches
# no child processes.
#

set -g status-right-length 80

# CPU and RAM display.
set -g status-right "#[fg=#{@status_cpu_color}] 󰻠 #{@status_cpu} #[fg=#{@status_ram_color}] 󰍛 #{@status_ram} #[default]"

# Default values if the collector
# has not populated them yet.
set -gF @status_cpu "#{?@status_cpu,#{@status_cpu},--}"
set -gF @status_ram "#{?@status_ram,#{@status_ram},--}"

set -gF @status_cpu_color "#{?@status_cpu_color,#{@status_cpu_color},#{@status_cpu_low}}"
set -gF @status_ram_color "#{?@status_ram_color,#{@status_ram_color},#{@status_ram_low}}"

# Append network speed.
set -ag status-right "#{@status_net}"


# ------------------------------------------------------
# Background Status Collector
# ------------------------------------------------------
#
# Starts the cross-platform collector that monitors:
#
# • CPU
# • Memory
# • Network
#
# Updates every 5 seconds.
#
run-shell -b "~/.config/tmux/scripts/status-feed.sh 5"
