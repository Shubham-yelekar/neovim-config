# ╭─────────────────────────────────────────────────────╮
# │                  Pane Management                    │
# │      Matches the terminal's Ctrl+Alt+* shortcuts    │
# │             (No prefix required)                    │
# ╰─────────────────────────────────────────────────────╯


# ------------------------------------------------------
# Right-click Paste
# ------------------------------------------------------
#
# If the current application is capturing mouse events
# (such as Neovim, Yazi, etc.):
#
#     → Forward the mouse event to the application.
#
# Otherwise:
#
#     → Paste the contents of the system clipboard.
#
bind-key -T root MouseDown3Pane \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    "send-keys -M" \
    'run-shell "~/.config/tmux/scripts/clipboard_paste.sh | tmux load-buffer - && tmux paste-buffer -p"'


# ------------------------------------------------------
# Split / Close Panes
# ------------------------------------------------------

# Split vertically (left/right).
#
# The new pane starts in the current pane's directory.
bind-key -n C-M-s split-window -h -c "#{pane_current_path}"

# Split horizontally (top/bottom).
#
# The new pane starts in the current pane's directory.
bind-key -n C-M-v split-window -v -c "#{pane_current_path}"

# Close the current pane.
bind-key -n C-M-w kill-pane


# ------------------------------------------------------
# Pane Navigation / Resizing
# ------------------------------------------------------
#
# The logic that decides whether a key should be handled
# by Neovim or tmux is entirely contained in:
#
#     scripts/pane-nav.sh
#
# That script contains the full implementation and
# documentation.
#
# Design philosophy:
#
#     Detect the program that currently owns the terminal.
#
# Instead of relying on smart-splits.nvim's
#
#     @pane-is-vim
#
# state variable.
#
# Why?
#
# If Neovim crashes or is forcefully terminated,
# @pane-is-vim can remain set forever.
#
# This leaves tmux believing Neovim is still active,
# causing pane navigation to stop working.
#
# This configuration avoids that problem by checking
# the actual foreground process instead.
#
# Supported:
#
# • Neovim
# • sudo / env wrappers
# • Wrapper scripts that don't exec
# • Git commit editor
# • Editors launched from Yazi
# • SSH / Mosh sessions
#
# Ignored:
#
# • Suspended Neovim
# • Background Neovim processes
# • Headless Neovim instances
#
%hidden PANE_NAV="~/.config/tmux/scripts/pane-nav.sh"


# ------------------------------------------------------
# Focus Navigation
# ------------------------------------------------------
#
# The helper script decides whether the key should:
#
#   • Move to another Neovim split
#
# or
#
#   • Move to another tmux pane.
#
bind-key -n C-M-h run-shell -b "$PANE_NAV move h '#{pane_id}'"
bind-key -n C-M-j run-shell -b "$PANE_NAV move j '#{pane_id}'"
bind-key -n C-M-k run-shell -b "$PANE_NAV move k '#{pane_id}'"
bind-key -n C-M-l run-shell -b "$PANE_NAV move l '#{pane_id}'"


# ------------------------------------------------------
# Resize Panes
# ------------------------------------------------------
#
# Uses the same helper script so resizing behaves
# consistently with navigation.
#
bind-key -n C-M-Left  run-shell -b "$PANE_NAV resize h '#{pane_id}'"
bind-key -n C-M-Down  run-shell -b "$PANE_NAV resize j '#{pane_id}'"
bind-key -n C-M-Up    run-shell -b "$PANE_NAV resize k '#{pane_id}'"
bind-key -n C-M-Right run-shell -b "$PANE_NAV resize l '#{pane_id}'"


# ------------------------------------------------------
# Pane Zoom
# ------------------------------------------------------
#
# Toggle fullscreen for the current pane.
#
# Uses tmux's built-in per-window zoom.
#
# No temporary or hidden windows are created.
#
bind-key -n C-M-b resize-pane -Z


# ------------------------------------------------------
# Navigation Inside Copy Mode
# ------------------------------------------------------
#
# Continue using Ctrl+Alt+H/J/K/L while in copy mode.
#
# Prevents getting "stuck" inside copy mode when you
# want to move to another pane.
#
bind-key -T copy-mode-vi C-M-h if -F "#{pane_at_left}"   "" "select-pane -L"
bind-key -T copy-mode-vi C-M-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -T copy-mode-vi C-M-k if -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -T copy-mode-vi C-M-l if -F "#{pane_at_right}"  "" "select-pane -R"


# ------------------------------------------------------
# Ctrl + Click URLs
# ------------------------------------------------------
#
# If the clicked text is an OSC-8 hyperlink,
# open its real destination.
#
# Otherwise,
# use the clicked word as a normal URL.
#
# #{q:...} safely escapes the shell argument,
# preventing accidental expansion when passing
# values through nested run-shell commands.
#
bind -n C-MouseDown1Pane \
  if-shell -F "#{||:#{m:*://*,#{mouse_hyperlink}},#{m:*://*,#{mouse_word}}}" \
    'run-shell -b "~/.config/tmux/scripts/open-url.sh #{?#{m:*://*,#{mouse_hyperlink}},#{q:mouse_hyperlink},#{q:mouse_word}}"'
