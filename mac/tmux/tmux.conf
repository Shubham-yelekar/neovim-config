# ╭─────────────────────────────────────────────────────╮
# │      tmux Configuration                             │
# │   Matches the standalone terminal keybindings       │
# ╰─────────────────────────────────────────────────────╯

# After editing this file, tmux must be reloaded manually.
# Restarting your terminal is NOT enough.
#
# Reload with:
#
#     tmux source ~/.config/tmux/tmux.conf
#
# Or, inside tmux:
#
#     Prefix + r


# ------------------------------------------------------
# Load configuration modules
# ------------------------------------------------------

# General options
source-file ~/.config/tmux/conf/options.conf

# Vi-style copy mode
source-file ~/.config/tmux/conf/copy-mode.conf

# Pane management
# Splits, navigation, resizing
source-file ~/.config/tmux/conf/pane.conf

# Window management
# New, close, rename, switching
source-file ~/.config/tmux/conf/window.conf

# Floating popup terminal
source-file ~/.config/tmux/conf/popup.conf

# Plugin manager (TPM) and plugin configuration
source-file ~/.config/tmux/conf/plugins.conf

# Status bar
source-file ~/.config/tmux/conf/status.conf

# Automatically hide the status bar while inside Neovim
# (Currently disabled)
# source-file ~/.config/tmux/conf/hide-bar.conf


# ------------------------------------------------------
# Reload configuration
# ------------------------------------------------------
#
# Reloads this entry file,
# which in turn reloads every module above.
#
# Usage:
#
#     Prefix + r
#
bind r source-file ~/.config/tmux/tmux.conf \; \
display "tmux.conf reloaded"
